# Run this ONCE (Actions tab -> Generate Signing Keystore -> Run workflow).
# It creates a release keystore with random passwords and gives it to you as a private artifact.
# Save the files safely, add them as repo Secrets, then DELETE the artifact.
name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          mkdir out && cd out
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          ALIAS=alcove-workforce
          echo "::add-mask::$PASS"
          keytool -genkeypair -v \
            -keystore release.jks -storetype PKCS12 \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Alcove Realty, OU=IT, O=Alcove Realty, L=Kolkata, C=IN"
          base64 -w 0 release.jks > keystore_base64.txt
          {
            echo "Add these 4 GitHub Secrets (Settings > Secrets and variables > Actions):"
            echo ""
            echo "KEYSTORE_BASE64  = full content of keystore_base64.txt"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = $ALIAS"
            echo "KEY_PASSWORD      = $PASS"
            echo ""
            echo "KEEP release.jks + this file SAFE. Losing them = you can never update the installed app."
          } > credentials.txt

      - name: Upload keystore (private, 1 day)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-DELETE-AFTER-SAVING
          path: out/
          retention-days: 1
