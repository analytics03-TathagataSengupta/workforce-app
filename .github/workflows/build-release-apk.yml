name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]          # push a tag like v1.0.0 -> also creates a GitHub Release
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write            # needed to publish GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Tag build -> versionName = tag (e.g. v1.2.0); otherwise 1.0.<run number>
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is missing. Run the 'Generate Signing Keystore' workflow first and add the 4 secrets (see README)."
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::Signed APK not found"; ls -R app/build/outputs/apk; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/AlcoveWorkforce-${VERSION_NAME}.apk"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlcoveWorkforce-${{ env.VERSION_NAME }}
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
